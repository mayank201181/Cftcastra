name: Refresh daily research feeds
on:
  schedule:
    - cron: '40 23 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/research.yml'
      - 'scripts/refresh-research.py'
      - 'data/research-markets.json'
permissions:
  contents: write
concurrency:
  group: cftc-archive
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install public-report parsers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python3 -m pip install -r scripts/requirements-research.txt
      - name: Refresh and validate independent research feeds
        run: |
          python3 scripts/verify-research-feeds.py
          python3 scripts/refresh-research.py
          python3 scripts/verify-research-feeds.py --archive
      - name: Preserve dated observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-prices.json.gz data/research-inputs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated daily research feeds and independent positioning sources'
            git push
          fi
