name: Refresh CFTC archive
on:
  schedule:
    - cron: '15 22 * * 1,5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh.yml'
      - 'scripts/refresh.py'
      - 'data/field-mappings.json'
permissions:
  contents: write
concurrency:
  group: cftc-archive
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download and validate official positions
        run: python3 scripts/refresh.py
      - name: Preserve validated raw histories
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json.gz data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated CFTC position archives and dated price proxies'
            git push
          fi
